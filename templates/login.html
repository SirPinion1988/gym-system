<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión Personal | {{ gym_nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- VINCULACIÓN AUTOMÁTICA DEL TEMA ROSA BARBIE -->
    <link rel="stylesheet" href="/static/theme-override.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 border border-indigo-500/40 mx-auto flex items-center justify-center font-black text-indigo-400 text-xl">
                GP
            </div>
            <h1 class="text-xl font-black text-white">{{ gym_nombre }}</h1>
            <p class="text-xs text-slate-400">Acceso exclusivo para Administración y Recepción</p>
        </div>

        {% if error %}
        <div class="bg-rose-950/60 border border-rose-800 text-rose-300 text-xs p-3 rounded-xl text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login/admin" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold">Usuario</label>
                <input type="text" name="username" required placeholder="admin" autofocus class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                Entrar al Sistema
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800">
            <a href="/" class="text-xs text-slate-400 hover:text-white transition">&larr; Volver al portal general</a>
        </div>
    </div>
</body>
</html>
