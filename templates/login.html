<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Gimnasio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-black text-emerald-400">
                GP
            </div>
            <h1 class="text-2xl font-bold text-white">Sistema de Gimnasio</h1>
            <p class="text-sm text-slate-400 mt-1">Control de Socios, Pagos y Molinete</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/40 text-red-400 p-3 rounded-lg text-sm mb-4 text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Usuario</label>
                <input type="text" name="username" required autocomplete="username" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Contraseña</label>
                <input type="password" name="password" required autocomplete="current-password" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-lg text-white transition mt-2">
                Ingresar al Panel
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center">
            <a href="/socio/login" class="text-xs text-emerald-400 hover:underline">¿Sos socio? Ingresá acá a tu credencial QR</a>
        </div>
    </div>
</body>
</html>
