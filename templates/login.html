<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <img src="/static/img/logo.png" alt="Logo" class="w-16 h-16 mx-auto mb-3 object-contain" onerror="this.src='https://via.placeholder.com/60?text=GYM'">
            <h1 class="text-2xl font-bold text-white">Sistema de Gimnasio</h1>
            <p class="text-sm text-slate-400">Control de Socios, Pagos y Molinete</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500 text-red-400 p-3 rounded-lg text-sm mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Usuario</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-2.5 rounded-lg text-white transition">Ingresar</button>
        </form>
    </div>
</body>
</html>
