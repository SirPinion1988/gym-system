<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Molinete | GymPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center">
        <!-- Indicador de Semáforo -->
        <div id="luz-estado" class="w-24 h-24 rounded-full mx-auto mb-6 bg-slate-800 border-4 border-slate-700 flex items-center justify-center transition-all duration-300 shadow-xl">
            <span id="icono-estado" class="text-3xl">🔒</span>
        </div>

        <h1 class="text-2xl font-black text-white mb-1">Molinete de Acceso</h1>
        <p id="texto-estado" class="text-xs text-slate-400 mb-6">Listo para leer código QR o token de acceso.</p>

        <!-- Formulario de Token QR -->
        <form id="form-molinete" onsubmit="validarAcceso(event)" class="space-y-4">
            <div>
                <input type="text" id="input-token" required placeholder="Escanear o ingresar token QR..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm font-mono text-center text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">
                Validar Paso
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between text-xs text-slate-400">
            <a href="/dashboard" class="hover:text-white transition">&larr; Volver al Panel</a>
            <span class="font-mono text-slate-500">Hardware Sim: ONLINE</span>
        </div>
    </div>

    <script>
        async function validarAcceso(event) {
            event.preventDefault();
            const input = document.getElementById('input-token');
            const token = input.value.trim();
            if (!token) return;

            const luz = document.getElementById('luz-estado');
            const icono = document.getElementById('icono-estado');
            const texto = document.getElementById('texto-estado');

            try {
                const formData = new FormData();
                formData.append('token', token);

                const res = await fetch('/api/molinete/validar', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.abrir) {
                    luz.className = "w-24 h-24 rounded-full mx-auto mb-6 bg-emerald-500 border-4 border-emerald-300 flex items-center justify-center transition-all duration-300 shadow-2xl shadow-emerald-500/50";
                    icono.innerText = "🔓";
                    texto.innerHTML = `<b class="text-emerald-400 text-sm font-bold">${data.socio}</b><br/><span class="text-emerald-300 font-semibold">${data.motivo}</span>`;
                } else {
                    if (data.color === 'yellow') {
                        luz.className = "w-24 h-24 rounded-full mx-auto mb-6 bg-amber-500 border-4 border-amber-300 flex items-center justify-center transition-all duration-300 shadow-2xl shadow-amber-500/50";
                        icono.innerText = "⚠️";
                        texto.innerHTML = `<b class="text-amber-400 text-sm font-bold">${data.socio || ''}</b><br/><span class="text-amber-300 font-semibold">${data.motivo}</span>`;
                    } else {
                        luz.className = "w-24 h-24 rounded-full mx-auto mb-6 bg-rose-600 border-4 border-rose-400 flex items-center justify-center transition-all duration-300 shadow-2xl shadow-rose-600/50";
                        icono.innerText = "⛔";
                        texto.innerHTML = `<b class="text-rose-400 text-sm font-bold">${data.socio || ''}</b><br/><span class="text-rose-300 font-semibold">${data.motivo}</span>`;
                    }
                }

                input.value = '';
                input.focus();

                setTimeout(() => {
                    luz.className = "w-24 h-24 rounded-full mx-auto mb-6 bg-slate-800 border-4 border-slate-700 flex items-center justify-center transition-all duration-300 shadow-xl";
                    icono.innerText = "🔒";
                    texto.innerText = "Listo para leer código QR o token de acceso.";
                }, 4000);

            } catch (err) {
                alert("Error al conectar con la central de validación.");
            }
        }
    </script>
</body>
</html>
