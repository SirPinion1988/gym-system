<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Molinete | {{ gym_nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Tarjeta Principal del Simulador -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
        <div>
            <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 border border-indigo-500/40 mx-auto flex items-center justify-center text-2xl mb-2">
                🔄
            </div>
            <h1 class="text-xl font-black text-white">Simulador de Acceso / Molinete</h1>
            <p class="text-xs text-slate-400 mt-1">Ingresa el código o escanea con el lector USB de código de barras / QR.</p>
        </div>

        <!-- Pantalla de Estado del Molinete (Cambia dinámicamente según la respuesta del servidor) -->
        <div id="pantalla-estado" class="bg-slate-950 border border-slate-800 rounded-2xl p-6 space-y-3 transition-colors duration-300">
            <!-- Foto del socio cuando pasa -->
            <div id="molinete-foto-container" class="w-20 h-20 mx-auto rounded-full overflow-hidden border-2 border-slate-700 bg-slate-900 flex items-center justify-center">
                <span id="molinete-foto-fallback" class="text-slate-500 text-xs font-bold">ESPERANDO</span>
                <img id="molinete-foto" src="" alt="Foto" class="w-full h-full object-cover hidden">
            </div>

            <div>
                <h3 id="molinete-nombre" class="text-base font-bold text-white">Esperando Lectura...</h3>
                <p id="molinete-motivo" class="text-xs text-slate-400 mt-0.5">Apoya el código QR frente a la cámara o ingresa el token.</p>
            </div>
        </div>

        <!-- Formulario para ingreso manual o lector óptico -->
        <form id="form-molinete" onsubmit="validarAcceso(event)" class="space-y-3">
            <div>
                <input type="text" id="input-token" placeholder="Token QR (ej: GYM-38450123-ab12)" required autofocus class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-sm font-mono text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                Simular Paso por Molinete
            </button>
        </form>

        <div class="pt-2 border-t border-slate-800">
            <a href="/dashboard" class="text-xs text-slate-400 hover:text-white transition">&larr; Volver al Dashboard</a>
        </div>
    </div>

    <script>
        // Envía el token al endpoint /api/molinete/validar para verificar cuota, apto médico y prórroga
        async function validarAcceso(event) {
            event.preventDefault();
            const inputToken = document.getElementById('input-token');
            const token = inputToken.value.trim();
            if (!token) return;

            const pantalla = document.getElementById('pantalla-estado');
            const nombreEl = document.getElementById('molinete-nombre');
            const motivoEl = document.getElementById('molinete-motivo');
            const fotoImg = document.getElementById('molinete-foto');
            const fotoFallback = document.getElementById('molinete-foto-fallback');

            try {
                const formData = new FormData();
                formData.append('token', token);

                const res = await fetch('/api/molinete/validar', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                // Actualizar foto si vino en la respuesta
                if (data.foto) {
                    fotoImg.src = data.foto;
                    fotoImg.classList.remove('hidden');
                    fotoFallback.classList.add('hidden');
                } else {
                    fotoImg.classList.add('hidden');
                    fotoFallback.classList.remove('hidden');
                    fotoFallback.innerText = data.abrir ? 'OK' : 'X';
                }

                nombreEl.innerText = data.socio || 'QR Desconocido';
                motivoEl.innerText = data.motivo;

                // Modificar el color visual de la pantalla (Verde: Paso permitido | Rojo/Amarillo: Denegado)
                if (data.abrir) {
                    pantalla.className = "bg-emerald-950/60 border border-emerald-500/50 rounded-2xl p-6 space-y-3";
                    nombreEl.className = "text-base font-bold text-emerald-300";
                } else if (data.color === 'yellow') {
                    pantalla.className = "bg-amber-950/60 border border-amber-500/50 rounded-2xl p-6 space-y-3";
                    nombreEl.className = "text-base font-bold text-amber-300";
                } else {
                    pantalla.className = "bg-rose-950/60 border border-rose-500/50 rounded-2xl p-6 space-y-3";
                    nombreEl.className = "text-base font-bold text-rose-300";
                }

                // Limpiar el campo y prepararlo para la siguiente lectura
                inputToken.value = '';
                inputToken.focus();
            } catch (err) {
                alert('Error al conectar con el servidor de validación.');
            }
        }
    </script>
</body>
</html>
