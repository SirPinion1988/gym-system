<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida | {{ gym_nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- VINCULACIÓN AUTOMÁTICA DEL TEMA ROSA BARBIE -->
    <link rel="stylesheet" href="/static/theme-override.css">
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Tarjeta Principal con Estilo Rosa Barbie -->
    <div class="w-full max-w-md bg-white border-2 border-pink-300 rounded-3xl p-8 shadow-2xl space-y-6 text-black">
        
        <!-- Logotipo y Nombre del Gimnasio -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-pink-100 border-2 border-pink-400 mx-auto flex items-center justify-center font-black text-2xl text-[#da1884] shadow-sm">
                💖
            </div>
            <h1 class="text-2xl font-black text-black tracking-tight uppercase">{{ gym_nombre }}</h1>
            <p class="text-xs font-semibold text-gray-700">Portal de Acceso y Gestión de Socios</p>
        </div>

        <!-- Selector de Modo: Socio o Personal -->
        <div class="grid grid-cols-2 gap-2 bg-pink-50 p-1.5 rounded-2xl border border-pink-200 text-center text-xs font-bold">
            <button id="tab-socio" onclick="mostrarLogin('socio')" class="py-2.5 rounded-xl transition btn-barbie shadow-md">
                📱 Soy Socio
            </button>
            <button id="tab-admin" onclick="mostrarLogin('admin')" class="py-2.5 rounded-xl transition text-gray-700 hover:text-black hover:bg-pink-100">
                🔐 Personal / Admin
            </button>
        </div>

        <!-- ========================================================== -->
        <!-- FORMULARIO 1: SOCIO (DNI + CORREO ELECTRÓNICO)             -->
        <!-- ========================================================== -->
        <div id="box-socio" class="space-y-4">
            <form action="/login/socio" method="POST" class="space-y-3">
                {% if error_socio %}
                <div class="bg-pink-100 border border-pink-400 text-pink-900 text-xs p-3 rounded-xl font-medium">
                    {{ error_socio }}
                </div>
                {% endif %}
                <div>
                    <label class="block text-xs text-gray-800 mb-1 font-bold">Usuario (Tu DNI)</label>
                    <input type="text" name="dni" required placeholder="Ej: 38450123" class="w-full bg-pink-50/60 border border-pink-300 rounded-xl p-3 text-sm text-black focus:outline-none focus:border-[#da1884] font-mono">
                </div>
                <div>
                    <label class="block text-xs text-gray-800 mb-1 font-bold">Contraseña (Tu Correo Registrado)</label>
                    <input type="email" name="email" required placeholder="tu@email.com" class="w-full bg-pink-50/60 border border-pink-300 rounded-xl p-3 text-sm text-black focus:outline-none focus:border-[#da1884]">
                </div>
                <button type="submit" class="w-full btn-barbie font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-pink-500/30">
                    Abrir Mi Credencial y QR
                </button>
            </form>
        </div>

        <!-- ========================================================== -->
        <!-- FORMULARIO 2: ADMINISTRADOR / PERSONAL                     -->
        <!-- ========================================================== -->
        <div id="box-admin" class="space-y-4 hidden">
            <form action="/login/admin" method="POST" class="space-y-3">
                {% if error_admin %}
                <div class="bg-pink-100 border border-pink-400 text-pink-900 text-xs p-3 rounded-xl font-medium">
                    {{ error_admin }}
                </div>
                {% endif %}
                <div>
                    <label class="block text-xs text-gray-800 mb-1 font-bold">Usuario de Personal</label>
                    <input type="text" name="username" required placeholder="Sirpinion o admin" class="w-full bg-pink-50/60 border border-pink-300 rounded-xl p-3 text-sm text-black focus:outline-none focus:border-[#da1884]">
                </div>
                <div>
                    <label class="block text-xs text-gray-800 mb-1 font-bold">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-pink-50/60 border border-pink-300 rounded-xl p-3 text-sm text-black focus:outline-none focus:border-[#da1884]">
                </div>
                <button type="submit" class="w-full btn-barbie font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-pink-500/30">
                    Iniciar Sesión en el Panel
                </button>
            </form>

            <div class="text-center pt-2">
                <button onclick="document.getElementById('modal-recuperar').classList.remove('hidden')" class="text-xs text-[#da1884] hover:underline font-semibold">
                    ¿Olvidaste tu contraseña?
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL RECUPERACIÓN DE CONTRASEÑA POR EMAIL -->
    <div id="modal-recuperar" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white border-2 border-pink-300 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-black">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-black">Recuperar Contraseña</h3>
                <button onclick="document.getElementById('modal-recuperar').classList.add('hidden')" class="text-gray-500 hover:text-black text-2xl font-bold">&times;</button>
            </div>
            <p class="text-xs text-gray-600">Ingresa el correo electrónico asociado a tu cuenta de operador o administrador para enviarte el enlace seguro.</p>
            <form action="/recuperar-password/solicitar" method="POST" class="space-y-3">
                <input type="email" name="email" required placeholder="ejemplo@gympro.com" class="w-full bg-pink-50 border border-pink-300 rounded-xl p-2.5 text-sm text-black focus:outline-none focus:border-[#da1884]">
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="document.getElementById('modal-recuperar').classList.add('hidden')" class="px-4 py-2 bg-gray-200 text-xs font-bold rounded-xl text-gray-700">Cancelar</button>
                    <button type="submit" class="px-4 py-2 btn-barbie text-xs font-bold rounded-xl shadow-md">Enviar Correo</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function mostrarLogin(modo) {
            const boxSocio = document.getElementById('box-socio');
            const boxAdmin = document.getElementById('box-admin');
            const tabSocio = document.getElementById('tab-socio');
            const tabAdmin = document.getElementById('tab-admin');

            if (modo === 'socio') {
                boxSocio.classList.remove('hidden');
                boxAdmin.classList.add('hidden');
                tabSocio.className = "py-2.5 rounded-xl transition btn-barbie shadow-md";
                tabAdmin.className = "py-2.5 rounded-xl transition text-gray-700 hover:text-black hover:bg-pink-100";
            } else {
                boxAdmin.classList.remove('hidden');
                boxSocio.classList.add('hidden');
                tabAdmin.className = "py-2.5 rounded-xl transition btn-barbie shadow-md";
                tabSocio.className = "py-2.5 rounded-xl transition text-gray-700 hover:text-black hover:bg-pink-100";
            }
        }
    </script>
</body>
</html>
