<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | {{ gym_nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <!-- Logotipo y Encabezado Comercial -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 mx-auto flex items-center justify-center font-black text-emerald-400 text-xl">GP</div>
            <h1 class="text-2xl font-black text-white tracking-tight">{{ gym_nombre }}</h1>
            <p class="text-xs text-slate-400">Portal de Acceso y Gestión Integral</p>
        </div>

        <!-- Selector de Modo: Socio o Personal -->
        <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 text-center text-xs font-bold">
            <button id="tab-socio" onclick="mostrarLogin('socio')" class="py-2.5 rounded-xl transition bg-emerald-500 text-white shadow-md">
                📱 Soy Socio
            </button>
            <button id="tab-admin" onclick="mostrarLogin('admin')" class="py-2.5 rounded-xl transition text-slate-400 hover:text-white">
                🔐 Personal / Admin
            </button>
        </div>

        <!-- FORMULARIO 1: INGRESO DEL SOCIO A SU CREDENCIAL DIGITAL -->
        <div id="box-socio" class="space-y-4">
            <form action="/login/socio" method="POST" class="space-y-3">
                {% if error_socio %}
                <div class="bg-rose-950/60 border border-rose-800 text-rose-300 text-xs p-3 rounded-xl">
                    {{ error_socio }}
                </div>
                {% endif %}
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold">Número de DNI</label>
                    <input type="text" name="dni" required placeholder="Ej: 38450123" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold">Correo Electrónico Registrado</label>
                    <input type="email" name="email" required placeholder="tu@email.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">
                    Abrir Mi Credencial y QR
                </button>
            </form>
        </div>

        <!-- FORMULARIO 2: INGRESO DEL PERSONAL Y ADMINISTRADORES -->
        <div id="box-admin" class="space-y-4 hidden">
            <form action="/login/admin" method="POST" class="space-y-3">
                {% if error_admin %}
                <div class="bg-rose-950/60 border border-rose-800 text-rose-300 text-xs p-3 rounded-xl">
                    {{ error_admin }}
                </div>
                {% endif %}
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold">Usuario de Operador</label>
                    <input type="text" name="username" required placeholder="admin" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-semibold">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                    Iniciar Sesión en Administración
                </button>
            </form>
        </div>
    </div>

    <script>
        // Alterna entre la vista de socio y la de operador del gimnasio
        function mostrarLogin(modo) {
            const boxSocio = document.getElementById('box-socio');
            const boxAdmin = document.getElementById('box-admin');
            const tabSocio = document.getElementById('tab-socio');
            const tabAdmin = document.getElementById('tab-admin');

            if (modo === 'socio') {
                boxSocio.classList.remove('hidden');
                boxAdmin.classList.add('hidden');
                tabSocio.className = "py-2.5 rounded-xl transition bg-emerald-500 text-white shadow-md";
                tabAdmin.className = "py-2.5 rounded-xl transition text-slate-400 hover:text-white";
            } else {
                boxAdmin.classList.remove('hidden');
                boxSocio.classList.add('hidden');
                tabAdmin.className = "py-2.5 rounded-xl transition bg-indigo-600 text-white shadow-md";
                tabSocio.className = "py-2.5 rounded-xl transition text-slate-400 hover:text-white";
            }
        }
    </script>
</body>
</html>
